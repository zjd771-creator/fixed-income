  <polyline points="80,380 120,376 160,373 200,374 240,370 280,365 320,360 360,365 400,370 440,366 480,357 520,330 560,280 600,255 640,300 680,345 720,360 760,365 810,362 870,358" fill="none" stroke="#ea580c" stroke-width="4"/>
  <polyline points="80,371 120,365 160,360 200,350 240,320 280,240 320,135 360,210 400,310 440,350 480,365 520,360 560,355 600,350 640,345 680,350 720,360 760,365 810,355 870,350" fill="none" stroke="#16a34a" stroke-width="4"/>

