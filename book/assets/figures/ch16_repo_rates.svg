  <line x1="420" y1="112" x2="460" y2="112" stroke="#ea580c" stroke-width="4"/><text x="469" y="118" class="label">R007：含非银融资溢价</text>
  <line x1="690" y1="112" x2="730" y2="112" stroke="#16a34a" stroke-width="4"/><text x="739" y="118" class="label">GC007：交易所资金价格</text>

  <path d="M235 170 L313 143" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
