<svg xmlns="http://www.w3.org/2000/svg" width="950" height="500" viewBox="0 0 950 500" role="img" aria-labelledby="title desc">
  <title id="title">图16-2 DR007、R007 与 GC007 的变化及利差</title>
  <desc id="desc">教学情景图。DR007较稳定，R007在非银压力时走高，GC007在交易所资金需求冲击时上升。</desc>
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .title { font-size: 23px; font-weight: 700; }
      .label { font-size: 16px; }
      .small { font-size: 14px; fill: #475569; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #475569; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="950" height="540" fill="#ffffff"/>
  <text x="475" y="35" text-anchor="middle" class="title">图16-2　DR007、R007 与 GC007 的变化及利差</text>
