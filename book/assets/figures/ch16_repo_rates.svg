  <text x="68" y="445" text-anchor="end" class="small">1.5</text><text x="68" y="375" text-anchor="end" class="small">2.0</text>
  <text x="68" y="305" text-anchor="end" class="small">2.5</text><text x="68" y="235" text-anchor="end" class="small">3.0</text><text x="68" y="165" text-anchor="end" class="small">3.5</text>
